    <!-- GA4 (G-TECDFXEEVR) now runs as a tag inside this GTM container, not
         loaded directly here - having both double-fired gtag.js, double-
         counting pageviews and adding a redundant blocking request. -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="BurntStack Technologies builds websites, mobile apps, AI solutions, cloud platforms, and enterprise software that help businesses grow faster."
    />
    <!-- Fonts loaded non-blocking (preload + swap-to-stylesheet on load):
         this was a plain render-blocking <link rel="stylesheet">, and the
         page's actual data fetch (see Blog.jsx) consistently didn't fire
         until right around when these fonts finished loading - the browser
         was gating rendering/commit work behind this stylesheet the whole
         time. font-display: swap (already in the URL) means text still
         paints immediately with a fallback font either way. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,900&f[]=general-sans@500,600,700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,900&f[]=general-sans@500,600,700&display=swap"
      />
    </noscript>
    <title>BurntStack Technologies — Building Software That Powers Businesses</title>
